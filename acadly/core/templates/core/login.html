{% extends "core/base.html" %}{% block title %}Log in - Acadly{% endblock %}
{% block content %}<h1>Log in to Acadly</h1>
<form method="post" class="card">{% csrf_token %}{{ form.non_field_errors }}
<label for="{{ form.username.id_for_label }}">Email</label>{{ form.username }}{{ form.username.errors }}
<label for="{{ form.password.id_for_label }}">Password</label>{{ form.password }}{{ form.password.errors }}
<p><button type="submit">Log in</button></p></form>
<p class="muted">New here? <a href="{% url 'register' %}">Create an account</a></p>{% endblock %}
